# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: lunelio
subtitle: 记录游戏、阅读、技术与日常
description: lunelio 的个人博客，记录兴趣、思考与生活。
keywords:
author: lunelio
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://lunelio.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Butterfly customization. Keep these overrides in the site repo so the theme
# submodule can be updated without overwriting the site's personal settings.
theme_config:
  nav:
    logo: /img/avatar.jpg
    display_title: true
    display_post_title: true
    fixed: true
  menu:
    首页: / || fas fa-home
    文章: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
    清单: /lists/ || fas fa-list
    关于: /about/ || fas fa-heart
  social:
    fab fa-github: https://github.com/Lunelio || GitHub || '#24292e'
  avatar:
    img: /img/avatar.jpg
    effect: false
  disable_top_img: true
  background: /img/lunelio-background.jpeg
  subtitle:
    enable: true
    effect: false
    source: false
    sub: 记录游戏、阅读、技术与日常
  index_layout: 3
  index_post_content:
    method: 2
    length: 300
  font:
    font_family: "'LXGW WenKai', '霞鹜文楷', serif"
  blog_title_font:
    font_link: https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css
    font_family: "'LXGW WenKai', '霞鹜文楷', serif"
  cover:
    index_enable: false
    aside_enable: false
    archives_enable: false
  aside:
    enable: true
    position: right
    display:
      archive: true
      tag: true
      category: true
    card_author:
      enable: true
      description: 记录游戏、阅读、技术与日常
      button:
        enable: true
        icon: fab fa-github
        text: GitHub
        link: https://github.com/Lunelio
    card_announcement:
      enable: true
      content: 欢迎来到 lunelio 的个人博客。
    card_recent_post:
      enable: true
      limit: 5
    card_newest_comments:
      enable: false
    card_categories:
      enable: true
    card_tags:
      enable: true
    card_archives:
      enable: true
    card_webinfo:
      enable: true
  footer:
    owner:
      enable: true
      since: 2026
    copyright:
      enable: true
      version: true
    custom_text: 'Made with Hexo & Butterfly'
  inject:
    head:
      - <link rel="stylesheet" href="/css/lunelio-custom.css">
    bottom:
      - <script src="/js/lunelio-custom.js"></script>

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
